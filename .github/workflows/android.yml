name: Android app

on:
  push:
    paths: ["android/**", "static/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5   # PivotTest checks the Java strategy against static/*.js
        with:
          node-version: 20
      # GitHub's Ubuntu runners come with the Android SDK (ANDROID_HOME); Gradle fetches any missing parts
      - name: Test and build
        working-directory: android
        run: ./gradlew testReleaseUnitTest assembleRelease --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: LocalCharts-apk
          path: android/app/build/outputs/apk/release/app-release.apk
